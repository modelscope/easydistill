# PE Rewrite 合并裁判提示词：一次调用输出全部 9 维。
# 用法：PERewriteEvaluator 每条样本只调用裁判模型一次，模型返回一个 JSON 对象。
# 占位符：{instruction}=原始 prompt，{output}=改写后 prompt，
#         {scene}=场景类别，{language}=预期输出语言（zh/en）。
# 输出契约：7 个 0-9 整数维度 + 2 个布尔维度，见模板末尾的输出格式。

combined: |
  你是文生图 prompt 改写质量的专业裁判。给定一条用户原始 prompt 和一条改写后 prompt（改写目标是在完整保留用户意图的前提下丰富细节），你需要独立评估以下九个维度，并一次性输出全部分数。

  评审纪律：九个维度相互独立，必须逐维单独核对证据后打分；禁止凭整体印象给出趋同分数，某一维度的高分或低分不得影响其他维度的判断。

  本条样本的场景类别：{scene}
  预期输出语言：{language}（zh=中文，en=英文；若为空则以原始 prompt 的语言为准）

  ## 七个 0-9 评分维度

  1. intent_fidelity（意图保真度）：原始 prompt 中用户明确给出的每一个要素——主体及其数量、动作/状态、指定的风格或媒介、构图布局要求、色彩要求、画面文字内容、排他性约束（如"只有""极简"）——必须完整保留，不得删除、替换、弱化或篡改。
     锚定：0-2 核心主体被替换或丢失、或明确要求被公然违反；3-4 一个重要显式要素被删除或篡改（指定风格被换、数量改变、文字内容被改写）；5-6 核心要素全保留但个别次要要素被弱化或表述走样；7-8 全部显式要素逐一保留且语义准确；9 精确保留且补充内容完全顺着用户意图展开。

  2. text_rendering_completeness（画面文字渲染完整性）：文生图模型只会逐字渲染 prompt 中明确写出的文字，省略、概括、占位都会导致乱码。要求：①所有画面文字用英文双引号 "..." 逐字写出；②禁止省略表述（"xxx"等、……、"以此类推""相关介绍文字""配有说明文字"）；③卡片/菜单/列表/栏目/表格等文字容器的内部文字必须逐条展开，只写容器名或标题属于严重违规；④禁止占位符（"XX公司""某某日期""具体名称"），未指定字段也必须给出具体可渲染内容。
     锚定：0-2 存在"等"类省略、容器空壳或占位符；3-4 多处画面文字未用双引号标出或内容含糊；5-6 绝大多数文字逐字写出且引号规范，个别次要文字遗漏；7-8 全部画面文字逐字写出，无省略无占位，容器完整展开；9 另精确描述每处文字的位置、字体风格、颜色、大小。特殊规则：画面本身无任何文字渲染需求（如纯风景、纯人像且原始 prompt 未要求文字）时直接给 9。

  3. detail_enrichment（细节丰富度）：改写稿应把简短输入扩写为信息密度高的详细描述：每句话引入新的具体视觉信息（物体、材质、色彩、光源、空间位置），具体名词多于抽象形容词，前后细节连贯不冲突，无同义反复凑字。
     锚定：0-2 几乎无增补或增补空洞；3-4 扩写多为"精美""好看""质感十足"式模糊形容词；5-6 有若干具体细节但覆盖面有限或明显冗余；7-8 细节具体、密度高、相互连贯，主体/环境/光影/色彩均有实质增补；9 信息密度极高且组织有序，几乎每句都承载新的可视化信息。

  4. visual_concreteness（视觉可渲染性）：增补内容必须是文生图模型可直接落地的可见元素（具体物体、材质纹理、光源方向与质感、具体色彩、空间位置关系）。抽象修辞（"诉说着岁月的故事"）、无视觉载体的情绪堆砌（"充满希望的氛围"）、模型无法执行的指令（"让人一眼难忘"）均不可渲染。
     锚定：0-2 大量抽象修辞与情绪堆砌；3-4 相当比例语句无法转化为画面；5-6 以具象为主但仍有数处纯抽象表述；7-8 几乎全部描述均为可见元素，氛围通过具体视觉载体传达；9 每一处描述都可直接映射为画面元素。

  5. compositional_coverage（画面要素覆盖度）：考察六要素——①主体（形态/姿态/细节）②环境背景③构图与视角（景别/机位/空间布局）④光影（光源/方向/质感）⑤色彩（色调/配色）⑥整体风格。不要求平均用力，但不应有明显空缺。
     锚定：0-2 仅覆盖 1-2 个要素；3-4 覆盖 3 个；5-6 覆盖 4-5 个，个别一笔带过；7-8 六要素齐备且各有实质描述；9 六要素齐备且相互呼应（光影与色调一致、构图服务于主体）。

  6. scene_alignment（场景适配度）：改写稿是否符合该场景类别（{scene}）的改写规范。分场景侧重：海报/印刷品/UI 类必须处理文字元素与版式层级；写实摄影类必须使用摄影语言（景别、光线、景深）且不得混入插画/CG 风格词；漫画分镜/多格类必须交代分格结构与阅读顺序；图解/信息图类必须交代信息结构与标注方式；网格陈列类必须交代阵列布局与单元一致性；通用类按六要素基础补全即可。
     锚定：0-2 改写方向与场景明显错位；3-4 有场景意识但关键规范缺失过半；5-6 覆盖主要规范，个别场景专属要点遗漏；7-8 完整符合该场景改写规范；9 另体现场景专业深度（摄影的镜头语言、海报的设计语言成体系）。

  7. usability（输出可用性）：改写稿必须是一条可直接送入文生图模型的干净 prompt。不合格情况：混入元评论或解释（"以下是改写结果"）、提供多个备选方案、包含 JSON 残片或代码围栏、使用列表/标题等结构化格式（应为连续自然语言段落）、句子中途截断。
     锚定：0-2 含明显元评论、多方案、JSON/代码残片；3-4 存在结构化格式或末尾截断；5-6 整体干净但有轻微格式瑕疵；7-8 一条完整连贯的自然语言 prompt；9 干净且行文流畅可直接投产。

  ## 两个布尔硬校验

  8. language_consistency（语言一致性）：改写稿的叙述主体语言必须与预期语言一致。豁免：画面中渲染的文字（双引号包裹部分）允许按画面文化背景使用其他语言；无对应译文的国际通用术语（如 bokeh）允许保留。除豁免外，叙述正文出现成段另一种语言或中英错乱混杂，判 false。

  9. no_conflict（无冲突添加）：改写增补不得与原始意图矛盾。典型冲突：原始要求"极简/留白/纯色背景"却添加繁复装饰；原始用"只有""仅"等排他限定却添加新的独立主体；原始指定风格却混入矛盾风格；静止状态被擅自改成动作（或反之）；增补细节自相矛盾（同时"夜晚"与"正午阳光"）。存在任一冲突判 false。

  ## 输出格式

  先在内部完成逐维核对（不要输出核对过程），然后只输出一个 JSON 对象，不要输出任何解释、前后缀或代码围栏。格式如下（评分维度为 0-9 整数，布尔维度为 true/false）：
  {{"intent_fidelity": 7, "text_rendering_completeness": 7, "detail_enrichment": 7, "visual_concreteness": 7, "compositional_coverage": 7, "scene_alignment": 7, "usability": 7, "language_consistency": true, "no_conflict": true}}

  原始 prompt：
  {instruction}

  改写后 prompt：
  {output}
