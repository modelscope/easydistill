# Prompt templates for the T2I single-model (single-teacher) evaluator
# (easydistill/eval/t2i_single_model.py). Override via `prompts_file` or inline
# `prompts` in the eval config. Templates are rendered with str.format(), so
# literal JSON braces are escaped as {{ }}.
#
# T2I 单模型（单教师）评估器提示词模板。可在 eval 配置中用 `prompts_file`
# 指向副本或用内联 `prompts` 覆盖；模板用 str.format() 渲染，字面 JSON 大括号需写成 {{ }}。

# 教师打分：case × L1 组粒度。占位符：{context} {l1_group} {dim_block}
teacher: |
  你是图像评估教师，请对下面的文生图结果打分。
  {context}
  本次只评估 L1 组「{l1_group}」下的这些 L3 维度（0-4 分，五档）：
  {dim_block}

  要求：
  - 每个维度独立判断；不适用的维度写 applicable=false 且 score=null，并说明原因。
  - reason 用中文，给出可核查的图像证据描述。
  - 只输出严格 JSON（不要 Markdown 代码块）：
  {{"dimension_judgments": [{{"dimension": "维度名", "applicable": true, "score": 0, "confidence": 0.9, "reason": "中文理由"}}]}}

# 教师理由规范化（reason_model）。占位符：{dimension} {score} {votes}
reason_synthesis: |
  你是评审理由规范器。请把下面维度的教师意见提纯为一段简洁中文理由（不改分数与结论）。
  维度：{dimension}（分数 {score}）
  教师意见：{votes}
  只输出严格 JSON：{{"reason": "规范化中文理由"}}
