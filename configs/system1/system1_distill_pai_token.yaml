job_type: system1_distill

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: qwen3.7-max

dataset:
  input_path: examples/system1_sms_raw.jsonl
  output_path: outputs/system1_train_sms_pai_token.jsonl

system1:
  schema_path: examples/system1_sms_schema.yaml
  # labeled 直通 gold / distill 纯教师 / mixed α 混合
  variant: distill
  # single_verbalized | k_sample_freq | k_verbalized_mean | two_stage
  method: k_verbalized_mean
  samples: 4
  temperature: 0.7
  max_tokens: 2048
  max_workers: 8
  seed: 7
  # 每次调用 shuffle 选项序,防教师位置偏差 / shuffle options per call
  shuffle_options: true
  show_progress: true
  # 阶段级续跑;elicit 另有行级 checkpoint / stage- and row-level resume
  resume: true
  # aggregate:top-1 一致率低于阈值丢弃并计数 / drop low-agreement questions
  consistency_threshold: 0.6
  # aggregate:防 one-hot 退化收缩 / anti-one-hot shrinkage (0 disables)
  shrinkage: 0.02
  # mixed 变体 gold 权重 / gold weight for the mixed variant
  alpha: 0.7

pipeline:
  - stage: build_cases
    output_path: outputs/system1_cases_sms_pai_token.jsonl

  - stage: elicit
    config:
      max_workers: 8
      resume: true
    output_path: outputs/system1_elicit_sms_pai_token.jsonl

  - stage: aggregate
    config:
      consistency_threshold: 0.6
    output_path: outputs/system1_labels_sms_pai_token.jsonl

  - stage: build_dataset
    output_path: outputs/system1_train_sms_pai_token.jsonl
