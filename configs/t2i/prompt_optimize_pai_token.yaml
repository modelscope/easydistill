# Standalone T2I prompt optimization via PAI-Token.
# Rewrites seed text prompts into rich, descriptive prompts for T2I models.
# Usage:
#   export PAI_TOKEN_API_KEY=your_key
#   easydistill --config configs/t2i/prompt_optimize_pai_token.yaml

job_type: prompt_optimize

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: qwen3.7-max

prompt_optimize:
  temperature: 0.7
  max_tokens: 1024
  max_workers: 4
  show_progress: true

dataset:
  input_path: examples/seed_t2i_prompts.jsonl
  output_path: outputs/t2i_prompt_optimized.jsonl
  prompt_key: prompt
