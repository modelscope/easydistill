# Extract (instruction, response) pairs from raw text via PAI-Token.
job_type: instruction_response_extraction

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

synthesis:
  prompt_template_file: configs/prompts/extraction_prompt.txt
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/raw_texts.jsonl
  text_key: text
  output_path: outputs/extracted_pairs_pai_token.jsonl
  output_format: instruction_response
