# Simplify chain-of-thought reasoning via EAS.
job_type: cot_long2short

backend:
  type: pai_eas
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}
  model_id: Qwen3.5-4B
  timeout: 120.0
  max_retries: 3

cot:
  prompt_template_file: configs/prompts/cot_long2short_prompt.txt
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/seed_cot_pairs.jsonl
  problem_key: problem
  answer_key: answer
  output_path: outputs/cot_long2short_pai_eas.jsonl
  output_format: cot
