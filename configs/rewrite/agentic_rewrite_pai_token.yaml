# Agentic prompt rewrite via PAI-Token: each input prompt goes through a
# plan -> rewrite -> reflection teacher chain. Rows run concurrently; the
# three steps within one row are sequential. Extra input fields (expansion
# lineage) are passed through to the output.
job_type: agentic_rewrite

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: qwen3.7-plus         # default model for all steps

agentic_rewrite:
  plan:
    # prompt_template_file: configs/prompts/pe_rewrite/plan_prompt.txt (default)
    temperature: 0.3
    max_tokens: 1024
  rewrite:
    # Full per-scene system prompts ported from agentic-pe:
    # {scene_prompt_dir}/rewrite_{scene}_{lang}.txt, general_{lang} as fallback.
    # scene_prompt_dir: configs/prompts/pe_rewrite (default)
    temperature: 0.7
    max_tokens: 8192             # dense ~4000-char gen_prompt + JSON wrapper
  reflection:
    # prompt_template_file: configs/prompts/pe_rewrite/reflection_prompt.txt (default)
    model_id: qwen3.7-max        # stronger checker per plan doc
    temperature: 0.3
    max_tokens: 8192             # a correction must restate the full prompt
  max_workers: 4                 # rows rewritten concurrently
  show_progress: true

dataset:
  input_path: outputs/seed_anchored_expanded_pai_token.jsonl
  instruction_key: instruction
  output_path: outputs/agentic_rewritten_pai_token.jsonl
