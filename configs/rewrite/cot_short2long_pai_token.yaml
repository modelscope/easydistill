# Extend chain-of-thought reasoning via PAI-Token.
job_type: cot_short2long

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

cot:
  prompt_template_file: configs/prompts/cot_short2long_prompt.txt
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/seed_cot_pairs.jsonl
  problem_key: problem
  answer_key: answer
  output_path: outputs/cot_short2long_pai_token.jsonl
  output_format: cot
