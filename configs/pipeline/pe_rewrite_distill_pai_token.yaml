# End-to-end PE rewrite text pipeline in ONE command:
#   agentic_rewrite (plan -> rewrite -> reflection, qwen3.7-plus)
#   -> pe_rewrite_eval (combined 9-metric judge, qwen3.7-max)
#   -> quality_filter (plan-doc thresholds + top-80%)
#   -> build_sft (student SFT samples, per-language system prompt)
# Each stage writes its intermediate jsonl for auditing; dataset.output_path
# holds the final SFT dataset. Prepend a seed_anchored_expansion stage for
# production runs that start from seeds instead of ready prompts.
job_type: pe_rewrite_distill

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: qwen3.7-plus         # default model (teacher steps)

pipeline:
  - stage: agentic_rewrite
    config:
      plan:
        temperature: 0.3
        max_tokens: 256
      rewrite:
        temperature: 0.7
        max_tokens: 8192
      reflection:
        model_id: qwen3.7-max    # stronger checker per plan doc
        temperature: 0.3
        max_tokens: 8192
      max_workers: 50
      show_progress: true
      stream_output_path: outputs/pe_distill_rewrite.stream.jsonl
    output_path: outputs/pe_distill_rewrite.jsonl
  - stage: pe_rewrite_eval
    config:
      model_id: qwen3.7-max      # judge separated from the plus teacher (D9)
      temperature: 0.0
      max_tokens: 512
      max_workers: 50
    output_path: outputs/pe_distill_scored.jsonl
  - stage: quality_filter
    config:
      # Hard score gates only (plan-doc thresholds); no top-ratio pruning,
      # so every row passing the gates goes to SFT.
      per_scene: false
    output_path: outputs/pe_distill_filtered.jsonl
  - stage: build_sft

sft:
  system_prompt_zh_file: configs/prompts/pe_rewrite/student_system_zh.txt
  system_prompt_en_file: configs/prompts/pe_rewrite/student_system_en.txt

dataset:
  input_path: examples/bench_rewrite_input.jsonl
  output_path: outputs/pe_distill_sft.jsonl
