# Advanced multi-modal instruction distillation pipeline via PAI-EAS.
# Flow: (image, instruction) -> mm_instruct_distill -> mm_instruct_eval -> quality_filter -> SFT.

job_type: advanced_mm_distill

backend:
  type: pai_eas
  model_id: Qwen3.5-4B
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}

generation:
  system_prompt: "You are a helpful visual assistant. Answer based on the image(s)."
  temperature: 0.7
  max_tokens: 2048

sft:
  skip_empty: true
  min_length: 10
  max_length: 8192

eval:
  prompts_file: configs/prompts/default_eval_prompts.yaml
  metrics:
    - informativeness
    - helpfulness
    - correctness
  temperature: 0.0
  max_tokens: 512
  max_workers: 4

pipeline:
  - stage: mm_instruct_distill
    config:
      temperature: 0.7
      max_tokens: 2048
      show_progress: true
      max_workers: 3
    output_path: outputs/mm_bp_stage1_generated.jsonl

  - stage: mm_instruct_eval
    config:
      show_progress: true
      max_workers: 4
    output_path: outputs/mm_bp_stage2_evaluated.jsonl

  - stage: quality_filter
    config: {}
    output_path: outputs/mm_bp_stage3_filtered.jsonl

  - stage: build_sft
    config: {}

dataset:
  input_path: examples/mm_seed_instructions.jsonl
  output_path: outputs/mm_bp_sft_pai_eas.jsonl
