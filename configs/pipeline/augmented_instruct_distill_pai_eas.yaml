# End-to-end augmented instruction distillation pipeline via PAI-EAS.
job_type: augmented_instruct_distill

backend:
  type: pai_eas
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}
  model_id: Qwen3.5-4B

generation:
  system_prompt: "You are a helpful assistant. Provide concise and accurate answers."
  temperature: 0.7
  max_tokens: 512

pipeline:
  - stage: instruction_expansion
    config:
      prompt_template_file: configs/prompts/expansion_prompt.txt
      num_in_context_samples: 2
      num_output_samples: 3
      temperature: 0.8
      max_tokens: 512
      show_progress: true
      max_workers: 3
    output_path: outputs/augmented_stage1_expanded_pai_eas.jsonl

  - stage: instruction_refinement
    config:
      prompt_template_file: configs/prompts/refinement_prompt.txt
      temperature: 0.7
      max_tokens: 512
      show_progress: true
      max_workers: 3
    output_path: outputs/augmented_stage2_refined_pai_eas.jsonl

  - stage: instruct_distill
    config:
      show_progress: true
      max_workers: 3

dataset:
  input_path: examples/seed_instructions.jsonl
  output_path: outputs/augmented_instruct_distill_sft_pai_eas.jsonl
  skip_empty: true
  min_length: 10
  max_length: 8192
