# Advanced T2V/I2V distillation pipeline via PAI-EAS (LLM/VLM + video model).
# Flow: prompt_optimize -> t2v_generate -> t2v_eval -> quality_filter -> build_t2v_sft.
# Rows with `first_frame_image` run in I2V mode; rows without it run plain T2V.
# first_frame_image accepts local paths or http(s) URLs.

job_type: advanced_t2v_distill

# Text/VLM model for prompt optimization (I2V rows attach the first frame,
# so a VLM is recommended when the seed file contains I2V rows).
backend:
  type: pai_eas
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}
  model_id: Qwen3.5-VL-32B           # adjust to your deployed VLM
  timeout: 120.0

# VLM judge for video evaluation (falls back to `backend` when omitted).
eval_backend:
  type: pai_eas
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}
  model_id: Qwen3.5-VL-32B
  timeout: 120.0

# Video generation backend (PAI-EAS deployed video model).
t2v_backend:
  type: pai_video
  endpoint_url: ${EAS_VIDEO_ENDPOINT_URL}   # dedicated video service endpoint
                                            # NOTE: use the public endpoint
                                            # (without ".vpc.") unless running
                                            # inside the same VPC as the service
  token: ${EAS_VIDEO_TOKEN}
  model_id: minimax-h3                      # adjust to your deployed video model
  auth_prefix: ""                           # EAS expects a raw token (no Bearer)
  protocol: sglang                          # sglang OpenAI-style /v1/videos API
                                            # (submit -> poll -> download binary);
                                            # "legacy" = /videos/generations
  t2v_task: t2va                            # sglang task names
  i2v_task: fl2va
  sglang_short_edge: 768                    # minimax_h3 requires exactly 768
  sglang_aspect_ratio: "16:9"
  sglang_duration_seconds: 5.0
  output_dir: outputs/t2v_videos            # binary videos are saved here
  poll_interval: 10.0
  max_poll_wait: 1800.0

generation:
  # sglang resolution is controlled via the t2v_backend sglang_* knobs above;
  # `duration` (seconds) overrides sglang_duration_seconds per call.
  # duration: 5
  max_workers: 1                            # EAS video services are often
                                            # single-concurrency; keep at 1
  # Per-row overrides (T2V rows only): seed rows may carry `resolution`
  # (or `auto` for an LLM-inferred aspect ratio) and/or `ratio`; they
  # override the sglang_* knobs above for that row.  I2V rows always
  # follow their first frame; set i2v_frame_check to guard degenerate
  # frames: off | warn | skip | raise.
  # i2v_frame_check: skip
  # i2v_frame_min_edge: 256          # minimum short edge in pixels
  # i2v_frame_max_aspect: 3.0        # max long/short edge ratio

sft:
  skip_empty: true

eval:
  # Composable checker chain: each entry is one BaseVideoChecker with its
  # own knobs; order = execution order; `enabled: false` switches one off.
  # Each checker records its own raw score columns; unify/filter downstream.
  checkers:
    - type: vbench                   # objective per-video scores, 0-1 floats
      # Install VBench into its own venv (its pinned deps conflict with
      # easydistill's; needs Python <= 3.11):
      #   python3.10 -m venv /path/to/vbench_env
      #   /path/to/vbench_env/bin/pip install vbench
      # then set vbench_bin below (or the VBENCH_BIN env var).  A GPU is
      # needed for most dimensions; without a usable setup the checker logs
      # a warning and leaves its columns blank (vbench_skipped_reason).
      enabled: false
      # vbench_bin: /path/to/vbench_env/bin/vbench
      # vbench_repo: /path/to/VBench   # alternative: run from a repo clone
      dimensions:
        - motion_smoothness
        - dynamic_degree
        - imaging_quality
        - temporal_flickering
    - type: vlm                      # frame-based VLM judge, one structured
                                     # multi-dimension call per row, 0-4 ints
                                     # (+ <dim>_confidence / <dim>_reason)
      metrics:
        - prompt_consistency
        - visual_quality
        - subject_consistency
        - first_frame_consistency    # auto not-applicable for plain T2V rows
      frame_sample_count: 8
      frame_max_size: 768
      temperature: 0.0
      max_tokens: 2048
      max_workers: 4
    - type: omni                     # full-video judge: dynamic dimensions
                                     # (motion_quality / temporal_execution /
                                     # camera_accuracy), 0-4 ints. Needs a
                                     # video-capable endpoint; enable after
                                     # configuring one below.
      enabled: false
      # backend:                     # dedicated video-understanding endpoint
      #   type: pai_token
      #   api_key: ${PAI_TOKEN_API_KEY}
      #   base_url: ${PAI_TOKEN_BASE_URL}
      #   model_id: qwen3.5-omni-plus
      # video_transport: auto        # auto | url | base64
      # max_video_mb: 100
  # Metrics used by quality_filter's top-k/ratio averaging.
  metrics:
    - prompt_consistency
    - visual_quality
    - subject_consistency

pipeline:
  - stage: prompt_optimize
    config:
      # Two-stage optimization (extract -> compose): 2 LLM calls per row.
      # A generic caption schema is built in; for best quality set
      # `schema_file` (or inline `schema`) to a schema written from your
      # target video model's official prompt guideline.
      # schema_file: path/to/your_model_caption_schema.txt
      temperature: 0.7
      max_tokens: 1024
      show_progress: true
      max_workers: 4
    output_path: outputs/t2v_stage1_optimized.jsonl

  - stage: t2v_generate
    config:
      show_progress: true
      # Resume from this stage's output_path on re-run: completed rows are
      # reused and each new video is checkpointed row-by-row.  Delete the
      # output file to force a full re-run.
      resume: true
    output_path: outputs/t2v_stage2_generated.jsonl

  - stage: t2v_eval
    config:
      show_progress: true
      # Rows already scored in the output file are not re-evaluated.
      resume: true
    output_path: outputs/t2v_stage3_evaluated.jsonl

  - stage: quality_filter
    config:
      # VLM judge scores are on the 0-4 scale.
      min_scores:
        prompt_consistency: 3
        visual_quality: 2
    output_path: outputs/t2v_stage4_filtered.jsonl

  - stage: build_t2v_sft
    config: {}

dataset:
  input_path: examples/seed_t2v_prompts.jsonl
  output_path: outputs/t2v_sft_pai_eas.jsonl
