# Generate teacher responses for multi-modal instructions via PAI-Token.
job_type: mm_instruct_distill

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

mm:
  system_prompt: "You are a helpful visual assistant. Answer based on the image(s)."
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/mm_seed_instructions.jsonl
  output_path: outputs/mm_instruct_distill_pai_token.jsonl