# Basic distillation using the PAI-Token service.
# Set PAI_TOKEN_API_KEY env var or fill api_key below.
# Usage:
#   easydistill --config configs/basic/instruct_distill_pai_token.yaml

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

generation:
  system_prompt: "You are a helpful assistant."
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 10  # concurrent API calls; reduce to 1 if 429 errors occur

dataset:
  input_path: examples/seed_instructions.jsonl
  output_path: outputs/sft_pai_token.jsonl
  instruction_key: instruction
  skip_empty: true
  min_length: 10
