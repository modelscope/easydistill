# Generate multi-modal chain-of-thought reasoning via PAI-Token.
job_type: mm_cot_distill

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

cot:
  prompt_template_file: configs/prompts/cot_generation_prompt.txt
  system_prompt: "You are a helpful visual reasoning assistant. Think step by step."
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/mm_seed_cot_problems.jsonl
  output_path: outputs/mm_cot_distill_pai_token.jsonl