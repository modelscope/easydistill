# Generate multi-modal chain-of-thought reasoning via PAI-EAS.
job_type: mm_cot_distill

backend:
  type: pai_eas
  model_id: Qwen3.5-4B
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}

cot:
  prompt_template_file: configs/prompts/cot_generation_prompt.txt
  system_prompt: "You are a helpful visual reasoning assistant. Think step by step."
  temperature: 0.7
  max_tokens: 2048
  show_progress: true
  max_workers: 3

dataset:
  input_path: examples/mm_seed_cot_problems.jsonl
  output_path: outputs/mm_cot_distill_pai_eas.jsonl