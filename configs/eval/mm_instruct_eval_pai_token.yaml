# Evaluate multi-modal instruction-following responses via PAI-Token.
job_type: mm_instruct_eval

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

eval:
  prompts_file: configs/prompts/default_eval_prompts.yaml
  metrics:
    - informativeness
    - helpfulness
    - correctness
  temperature: 0.0
  max_tokens: 512
  max_workers: 4
  show_progress: true

dataset:
  input_path: outputs/mm_instruct_distill_pai_token.jsonl
  output_path: outputs/mm_instruct_eval_pai_token.jsonl
