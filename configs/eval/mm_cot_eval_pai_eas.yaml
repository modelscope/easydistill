# Evaluate multi-modal CoT reasoning via PAI-EAS.
job_type: mm_cot_eval

backend:
  type: pai_eas
  model_id: Qwen3.5-4B
  endpoint_url: ${EAS_ENDPOINT_URL}
  token: ${EAS_TOKEN}

eval:
  prompts_file: configs/prompts/default_cot_eval_prompts.yaml
  metrics:
    - reasoning_verbosity
    - cognitive_difficulty
    - logical_correctness
  temperature: 0.0
  max_tokens: 512
  max_workers: 4
  show_progress: true

dataset:
  input_path: outputs/mm_cot_distill_pai_eas.jsonl
  output_path: outputs/mm_cot_eval_pai_eas.jsonl
