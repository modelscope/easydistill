# Evaluate chain-of-thought samples via PAI-Token.
job_type: cot_eval

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

eval:
  prompts_file: configs/prompts/default_cot_eval_prompts.yaml
  metrics:
    - reasoning_verbosity
    - cognitive_difficulty
    - logical_correctness
  temperature: 0.0
  max_tokens: 2048
  max_workers: 4
  show_progress: true

dataset:
  input_path: examples/cot_eval_samples.jsonl
  output_path: outputs/cot_eval_pai_token.jsonl
