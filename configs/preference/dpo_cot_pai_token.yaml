job_type: dpo_data_build

backend:
  type: pai_token
  api_key: ${PAI_TOKEN_API_KEY}
  base_url: ${PAI_TOKEN_BASE_URL}
  model_id: kimi-k2.6

dataset:
  input_path: examples/seed_cot_pairs.jsonl
  output_path: outputs/dpo_cot_dataset_pai_token.json

generation:
  system_prompt: "You are a helpful assistant."
  temperature: 0.8
  max_tokens: 2048
  max_workers: 4
  show_progress: true

preference:
  scorer: cot
  n: 2

pipeline:
  - stage: generate_candidates
    config:
      n: 2
      instruction_key: problem
      max_workers: 4
      show_progress: true
    output_path: outputs/dpo_cot_candidates_pai_token.jsonl

  - stage: score_candidates
    config:
      scorer: cot
      instruction_key: problem
      answer_key: answer
      alpha: 0.001
      max_workers: 4
      show_progress: true
    output_path: outputs/dpo_cot_scores_pai_token.jsonl

  - stage: build_preference_pairs
    config:
      instruction_key: problem
      answer_key: answer
      min_margin: 0.0
      max_pairs_per_prompt: 1
      require_chosen_correct: false
    output_path: outputs/dpo_cot_pairs_pai_token.jsonl

  - stage: build_preference_dataset
    config:
      instruction_key: problem
      format: llama_factory_alpaca
